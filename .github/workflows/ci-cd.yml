name: Smart OPD CI-CD

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # ── Validate & Compile Client (Vite + React) ─────────────────────────────────
  build-client:
    name: Build & Verify Client
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install Client Dependencies
        working-directory: client
        run: npm ci

      - name: Compile & Build Frontend
        working-directory: client
        run: npm run build

  # ── Validate & Lint Server (Flask + Python) ──────────────────────────────────
  build-server:
    name: Build & Lint Server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        working-directory: server
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Syntax & Compilation Check
        working-directory: server
        run: |
          # Verify that main app and route configurations import cleanly without syntax errors
          python -m py_compile app.py
